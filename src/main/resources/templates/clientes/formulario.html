<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario de Cliente</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card">

                <div class="card-header">

                    <h3
                        th:text="${cliente.idCliente == 0}
                        ? 'Nuevo Cliente'
                        : 'Editar Cliente'">

                        Nuevo Cliente

                    </h3>

                </div>


                <div class="card-body">

                    <form
                        th:action="${cliente.idCliente == 0}
                        ? @{/clientes/guardar}
                        : @{/clientes/actualizar}"
                        th:object="${cliente}"
                        method="post">


                        <!-- ID -->

                        <input
                            type="hidden"
                            th:field="*{idCliente}">


                        <!-- NIT -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                NIT

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{nit}"
                                required>

                        </div>


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Nombre

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{nombre}"
                                required>

                        </div>


                        <!-- APELLIDOS -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Apellidos

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{apellidos}"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                th:field="*{email}"
                                required>

                        </div>


                        <!-- BOTONES -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Guardar

                            </button>


                            <a
                                th:href="@{/clientes}"
                                class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
