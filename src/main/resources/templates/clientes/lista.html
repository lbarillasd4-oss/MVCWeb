<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clientes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">
            🏪 MVCWeb
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        th:href="@{/clientes}">
                        Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        th:href="@{/marcas}">
                        Marcas
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        th:href="@{/productos}">
                        Productos
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>
    

    <!-- ENCABEZADO -->

    <div
        class="d-flex justify-content-between align-items-center mb-4">

        <h1>
            Gestión de Clientes
        </h1>

        <a
            th:href="@{/clientes/nuevo}"
            class="btn btn-primary">

            + Nuevo Cliente

        </a>

    </div>


    <!-- TABLA -->

    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table
                    class="table table-bordered
                           table-striped
                           table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>

                            <th>NIT</th>

                            <th>Nombre</th>

                            <th>Apellidos</th>

                            <th>Email</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr
                            th:each="cliente : ${clientes}">

                            <td
                                th:text="${cliente.idCliente}">
                                1
                            </td>

                            <td
                                th:text="${cliente.nit}">
                                123456-7
                            </td>

                            <td
                                th:text="${cliente.nombre}">
                                Diego
                            </td>

                            <td
                                th:text="${cliente.apellidos}">
                                Ramírez
                            </td>

                            <td
                                th:text="${cliente.email}">
                                correo@gmail.com
                            </td>

                            <td>

                                <a
                                    th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}"
                                    class="btn btn-warning btn-sm">

                                    Editar

                                </a>


                                <a
                                    th:href="@{/clientes/eliminar/{id}(id=${cliente.idCliente})}"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Está seguro de eliminar este cliente?');">

                                    Eliminar

                                </a>

                            </td>

                        </tr>


                        <!-- SI NO HAY CLIENTES -->

                        <tr
                            th:if="${#lists.isEmpty(clientes)}">

                            <td
                                colspan="6"
                                class="text-center">

                                No hay clientes registrados.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
