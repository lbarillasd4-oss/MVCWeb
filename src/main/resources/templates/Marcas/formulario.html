<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario de Marca</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header">

                    <h3
                        th:text="${marca.idMarcas == 0}
                        ? 'Nueva Marca'
                        : 'Editar Marca'">

                        Nueva Marca

                    </h3>

                </div>


                <div class="card-body">

                    <form
                        th:action="${marca.idMarcas == 0}
                        ? @{/marcas/guardar}
                        : @{/marcas/actualizar}"
                        th:object="${marca}"
                        method="post">


                        <!-- ID OCULTO -->

                        <input
                            type="hidden"
                            th:field="*{idMarcas}">


                        <!-- NOMBRE -->

                        <div class="mb-3">

                            <label
                                class="form-label">

                                Nombre de la marca

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{nombre}"
                                maxlength="100"
                                required>

                        </div>


                        <!-- BOTONES -->

                        <div
                            class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Guardar

                            </button>


                            <a
                                th:href="@{/marcas}"
                                class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
