<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Formulario de Producto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header">

                    <h3
                        th:text="${producto.idProductos == 0}
                        ? 'Nuevo Producto'
                        : 'Editar Producto'">

                        Nuevo Producto

                    </h3>

                </div>

                <div class="card-body">

                    <form
                        th:action="${producto.idProductos == 0}
                        ? @{/productos/guardar}
                        : @{/productos/actualizar}"

                        th:object="${producto}"

                        method="post">

                        <input
                            type="hidden"
                            th:field="*{idProductos}">

                        <div class="mb-3">

                            <label class="form-label">
                                ID de Marca
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                th:field="*{idMarca}"
                                min="1"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Nombre del producto
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                th:field="*{nombre}"
                                maxlength="100"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Precio
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                th:field="*{precio}"
                                min="0"
                                step="0.01"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Stock
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                th:field="*{stock}"
                                min="0"
                                required>

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Guardar

                            </button>

                            <a
                                th:href="@{/productos}"
                                class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
