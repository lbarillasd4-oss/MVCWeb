<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tienda POO</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center">
            Sistema Tienda POO
        </h1>

        <p class="text-center">
            Aplicación Web MVC
        </p>

        <div class="row mt-5">

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Clientes
                        </h5>

                        <p class="card-text">
                            Gestión de clientes
                        </p>

                        <a href="/clientes"
                           class="btn btn-primary">
                            Clientes
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Empleados
                        </h5>

                        <p class="card-text">
                            Gestión de empleados
                        </p>

                        <a href="/empleados"
                           class="btn btn-success">
                            Empleados
                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body text-center">

                        <h5 class="card-title">
                            Productos
                        </h5>

                        <p class="card-text">
                            Gestión de productos
                        </p>

                        <a href="/productos"
                           class="btn btn-warning">
                            Productos
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
